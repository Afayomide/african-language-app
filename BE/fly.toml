# fly.toml app configuration file generated for african-language-app on 2026-09-18T16:32:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'african-language-app'
primary_region = 'iad'

[build]

[env]
  # The server reads PORT (default 4000); it must match internal_port below.
  PORT = "3000"
  # The default LLM provider is Gemini on Vertex, whose client is built at startup and
  # throws without Google credentials. Generation runs locally, never on Fly.
  LLM_PROVIDER = "ollama"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
